name: Täglich aktualisieren und veröffentlichen

on:
  schedule:
    - cron: '30 4 * * *'   # täglich ca. 05:30/06:30 Uhr deutsche Zeit
  workflow_dispatch:        # Knopf "Run workflow" zum manuellen Start
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Daten von fcdata.io holen
        if: github.event_name != 'push'
        run: python3 data/update.py
      - name: Neue Texte übersetzen (nur mit API-Key)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 data/translate.py
      - name: Änderungen speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "daily-update"
          git config user.email "daily-update@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git push)

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Nur die App-Dateien veröffentlichen
        run: |
          mkdir _site && cp -r index.html manifest.webmanifest sw.js css js icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
